<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Penumpang – Pesan pendamping</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#B00E28;text-decoration:none}a:hover{color:#8A0A1F}
button{font-family:inherit;cursor:pointer}
textarea::placeholder{color:#6B7080}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6FA; font-family: Nunito, 'Trebuchet MS', Arial, sans-serif; color: #1F2430; display: flex; flex-direction: column; overflow: hidden">
  <div style="background: #FFE4E8; border-radius: 0 0 32px 32px; padding: 44px 20px 22px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="Penumpang-Tiket.dc.html" aria-label="Kembali ke tiket" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F2430" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </a>
      <h1 style="margin: 0; font-size: 25px; font-weight: 900; letter-spacing: -0.3px">Pesan pendamping</h1>
    </div>
    <span style="align-self: flex-start; font-size: 14px; font-weight: 800; color: #5A4A50; background: rgba(255,255,255,0.75); padding: 8px 14px; border-radius: 999px">G1123 · Halim 08.10 · Gerbong 5, Kursi 7A</span>
  </div>

  <div style="padding: 18px 18px 0; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 18px; font-weight: 900">Bantuan apa yang Anda perlukan?</h2>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{bantuan}}" as="b" hint-placeholder-count="6">
          <sc-if value="{{b.selected}}" hint-placeholder-val="{{false}}">
            <button type="button" onClick="{{b.pick}}" aria-pressed="true" style="min-height: 104px; border-radius: 22px; border: 2px solid #E11D2E; background: #FFE4E8; color: #1F2430; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
              <span style="width: 44px; height: 44px; border-radius: 22px; background: #E11D2E; display: flex; align-items: center; justify-content: center">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{b.d}}"></path></svg>
              </span>
              <span style="font-size: 15px; font-weight: 900; line-height: 1.2; text-align: center">{{b.label}}</span>
            </button>
          </sc-if>
          <sc-if value="{{b.notSelected}}" hint-placeholder-val="{{true}}">
            <button type="button" onClick="{{b.pick}}" aria-pressed="false" style="min-height: 104px; border-radius: 22px; border: 2px solid #E6E8EF; background: #FFFFFF; color: #1F2430; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
              <span style="width: 44px; height: 44px; border-radius: 22px; background: #F3F4F8; display: flex; align-items: center; justify-content: center">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4A5060" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{b.d}}"></path></svg>
              </span>
              <span style="font-size: 15px; font-weight: 800; line-height: 1.2; text-align: center">{{b.label}}</span>
            </button>
          </sc-if>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 18px; font-weight: 900">Di mana kami menjemput Anda?</h2>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{jemput}}" as="j" hint-placeholder-count="3">
          <sc-if value="{{j.selected}}" hint-placeholder-val="{{false}}">
            <button type="button" onClick="{{j.pick}}" aria-pressed="true" style="min-height: 92px; border-radius: 20px; border: 2px solid #E11D2E; background: #FFE4E8; color: #1F2430; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#E11D2E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{j.d}}"></path></svg>
              <span style="font-size: 14px; font-weight: 900; line-height: 1.2; text-align: center">{{j.label}}</span>
            </button>
          </sc-if>
          <sc-if value="{{j.notSelected}}" hint-placeholder-val="{{true}}">
            <button type="button" onClick="{{j.pick}}" aria-pressed="false" style="min-height: 92px; border-radius: 20px; border: 2px solid #E6E8EF; background: #FFFFFF; color: #1F2430; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#4A5060" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{j.d}}"></path></svg>
              <span style="font-size: 14px; font-weight: 800; line-height: 1.2; text-align: center">{{j.label}}</span>
            </button>
          </sc-if>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="catatan" style="font-size: 18px; font-weight: 900">Catatan untuk petugas (opsional)</label>
      <textarea id="catatan" rows="2" placeholder="Contoh: saya membawa satu koper besar" style="font-family: inherit; font-size: 16px; font-weight: 600; border-radius: 20px; border: 2px solid #E6E8EF; padding: 12px 16px; resize: none; background: #FFFFFF; color: #1F2430"></textarea>
    </div>
  </div>

  <div style="flex: 1"></div>
  <a href="Penumpang-Status.dc.html" style="margin: 0 18px 20px; height: 64px; border-radius: 32px; background: #E11D2E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 19px; font-weight: 900; box-shadow: 0 10px 22px rgba(225,29,46,0.28)">
    Kirim permintaan
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { bantuan: 'kursi_roda', jemput: 'lobi' };
  }
  renderVals() {
    const bantuan = [
      { id: 'kursi_roda', label: 'Kursi roda', d: 'M12.8 4.5a1.8 1.8 0 1 1-3.6 0a1.8 1.8 0 1 1 3.6 0M11 7v6h5l2 5M11 10h4M8.5 11.5a5 5 0 1 0 7 6' },
      { id: 'tunanetra', label: 'Tunanetra', d: 'M3 3l18 18M10.6 6.1A10 10 0 0 1 12 6c5 0 8.5 4 9.5 6-.5 1-1.4 2.3-2.7 3.5M6.5 6.6C4.4 8 3 10 2.5 12c1 2 4.5 6 9.5 6 1.6 0 3-.4 4.3-1M9.9 9.9a3 3 0 0 0 4.2 4.2' },
      { id: 'tuli', label: 'Tuli', d: 'M3 3l18 18M7 9a5 5 0 0 1 9.6-2M17 11.5c-.3 2-1.6 2.9-1.9 4.6A3 3 0 0 1 9.5 18' },
      { id: 'lansia', label: 'Lansia', d: 'M11.8 4a1.8 1.8 0 1 1-3.6 0a1.8 1.8 0 1 1 3.6 0M10 7l-2 6 3 2v6M8 13l-2 8M15 11v10M13.5 11H15' },
      { id: 'hamil', label: 'Ibu hamil', d: 'M12 20s-7-4.4-7-9.6A4 4 0 0 1 12 8a4 4 0 0 1 7 2.4C19 15.6 12 20 12 20z' },
      { id: 'porter', label: 'Porter barang', d: 'M7 8h10a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2zM9 8V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V8M10 12v4M14 12v4' }
    ].map((b) => ({
      ...b,
      selected: this.state.bantuan === b.id,
      notSelected: this.state.bantuan !== b.id,
      pick: () => this.setState({ bantuan: b.id })
    }));
    const jemput = [
      { id: 'lobi', label: 'Lobi utama', d: 'M4 21V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v16M3 21h18M10 21v-5h4v5' },
      { id: 'parkir', label: 'Area parkir', d: 'M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM9 17V7h4a3 3 0 0 1 0 6H9' },
      { id: 'feeder', label: 'Kereta pengumpan', d: 'M8 3h8a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3zM5 10h14M9 21l1.5-4M15 21l-1.5-4' }
    ].map((j) => ({
      ...j,
      selected: this.state.jemput === j.id,
      notSelected: this.state.jemput !== j.id,
      pick: () => this.setState({ jemput: j.id })
    }));
    return { bantuan, jemput };
  }
}
</script>
</body>
</html>
